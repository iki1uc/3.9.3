// RAM=729 – ARBEIT=WAN – ORDNUNG.tmp.ready
import { limit40 } from './rom.js'

export const RAM_SIZE = 729
export const WAN = 'ARBEIT'
export const ORDNUNG = 'tmp.ready'

let mem = new Array(RAM_SIZE).fill(0)
let ready = false

export const RAM = {
  size: RAM_SIZE,
  alloc(n){ 
    n = limit40(n) // HOME 40 – f(x)=min(x,40) capped alloc
    mem = new Array(RAM_SIZE).fill(0).map((_,i)=> i < n*18 ? 1 : 0)
    return mem.length
  },
  ready(){
    ready = true
    mem[0] = 40 // ROOT = 40
    return { ready, home: 40, wan: WAN }
  },
  dump(){ return mem.slice(0,81) },
  get status(){ return { ready, total: RAM_SIZE, home: mem[0] } }
}

// Kommentare: RAM = Ring-Arbeits-Memory
// Jeder Layer 81 = 9x9 – 9 Layer = 729
// ORDNUNG.tmp.ready signalisiert Freigabe für RAW`},"raw.js":{lang:"js",desc:"RAW → RESPO → OUT – RESPO-FREI Modus: RAW→∅→OUT – fire & forget",code:`// raw.js – RAW Data Handling – RAW → RESPO → OUT
// Wie AUA aber für modem-core – Modem-Kern Pipeline
// RESPO-FREI: wenn frei=true, dann RAW direkt → OUT ohne ACK

export const PIPELINE = ['RAW','RESPO','OUT']
export let RESPO_FREI = false // toggle – was wollen wir jetzt?

export function parseRaw(buf){
  if(typeof buf==='string') buf = new TextEncoder().encode(buf)
  return { raw: buf, len: buf.length, ts: Date.now() }
}

export function toRespo(parsed){
  if(RESPO_FREI){
    // RESPO FREI – kein Response Pool, fire & forget
    return { respo: null, free: true, sum: 0, note: 'RESPO=∅ – kein ACK, kein WAIT' }
  }
  // RESPO = RESponse + POol – limit40 als Filter
  const filtered = parsed.raw.map(v => v > 40 ? 40 : v)
  return { respo: filtered, sum: filtered.reduce((a,b)=>a+b,0), free: false }
}

export function toOut(respoObj, parsed){
  const src = respoObj.free ? parsed.raw : respoObj.respo
  const chunks = []
  for(let i=0;i<src.length;i+=81){
    chunks.push(src.slice(i,i+81).map(v=> Math.min(v,40)))
  }
  return { out: chunks, layers: chunks.length, frei: respoObj.free }
}

export function handleRaw(input, frei=false){
  RESPO_FREI = frei
  const a = parseRaw(input)
  const b = toRespo(a)
  const c = toOut(b, a)
  return { ...a, ...b, ...c, pipe: b.free ? 'RAW→∅→OUT (FREI)' : 'RAW→RESPO→OUT' }
}

// Was wollen wir jetzt?

// f(x) = min(x,40) – HOME 40 Fixpunkt
// f² = f – idempotent – f(f(x)) = f(x)
// RS=40 ROOT 729 Codec 531k→81

export function limit40(x){
  return Math.min(x, 40)
}

export const HOME = 40
export const ROOT = 40
export const RS = 40

export function isFixpoint(x){
  return limit40(x) === x // true iff x <= 40
}

export function checkIdempotent(x){
  const fx = limit40(x)
  const ffx = limit40(fx)
  return fx === ffx // always true -> f²=f
}

// Codec 531k→81 – Kompression via HOME cap
export function encode531to81(arr){
  // 531k mock -> 81 via limit + chunk
  if(arr.length > 531) arr = arr.slice(0,531)
  const capped = arr.map(limit40)
  return capped.slice(0,81)
}`},"scsi.html":{lang:"html",desc:"SCSI – Small Computer System Interface – runSCSI",code:`<!-- scsi.html – SCSI – Small Computer System Interface -->
