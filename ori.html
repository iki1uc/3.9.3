}

:root {
  --bg: #000000;
  --surface: #010401;
  --panel: #020a02;
  --panel-2: #031503;
  --ink: #00ff00;
  --ink-dim: #00c800;
  --ink-faint: #0a5c0a;
  --line: #00ff00;
  --line-dim: #0a4d0a;
  --err: #ff4040;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --surface: #010401;
    --panel: #020a02;
    --panel-2: #031503;
    --ink: #00ff00;
    --ink-dim: #00c800;
    --ink-faint: #0a5c0a;
    --line: #00ff00;
    --line-dim: #0a4d0a;
    --err: #ff4040;
  }
}
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-mono);
}
::-moz-selection {
  background: var(--ink);
  color: #000;
}
::selection {
  background: var(--ink);
  color: #000;
}
/* BIOS scanline / CRT overlay */
.crt::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0, 255, 0, 0.025) 0px,
    rgba(0, 255, 0, 0.025) 1px,
    transparent 1px,
    transparent 3px
  );
}
@keyframes blink-hard {
  0%, 49% {
    opacity: 1;
  }
  50%, 100% {
    opacity: 0;
  }
}
.blink {
  animation: blink-hard 1s steps(1) infinite;
}
@keyframes pulse-flash {
  0% {
    background: rgba(0, 255, 0, 0.35);
  }
  100% {
    background: transparent;
  }
}
.pulse-flash {
  animation: pulse-flash 0.6s ease-out;
}
@keyframes boot-in {
  from {
    opacity: 0;
    transform: translateY(2px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.boot-in {
  animation: boot-in 0.25s ease-out both;
}
/* thin green scrollbars */
.thin-scroll::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
.thin-scroll::-webkit-scrollbar-track {
  background: #010401;
}
.thin-scroll::-webkit-scrollbar-thumb {
  background: var(--ink-faint);
}
.thin-scroll {
  scrollbar-width: thin;
  scrollbar-color: var(--ink-faint) #010401;
}
input[type='number']::-webkit-outer-spin-button,
input[type='number']::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
input[type='number'] {
  -moz-appearance: textfield;
  -webkit-appearance: textfield;
          appearance: textfield;
}
.placeholder\:text-\[var\(--ink-faint\)\]::-moz-placeholder{

.hover\:bg-\[var\(--ink\)\]:hover{

.hover\:bg-\[var\(--panel\)\]:hover{

}
.hover\:bg-\[var\(--panel-2\)\]:hover{

}
.focus\:border-\[var\(--line\)\]:focus{

}
.focus\:bg-\[var\(--panel\)\]:focus{

}
.focus\:bg-black:focus{

}
.focus\:outline-none:focus{

}
.disabled\:cursor-not-allowed:disabled{

}
.disabled\:opacity-40:disabled{

}
