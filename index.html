  box-sizing:border-box
}
html,body{
  background:var(--bg-deep);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased
}
button{
  font-family:inherit;
  color:inherit;
  background:none;
  cursor:pointer;
  border:0
}
a{
  color:inherit;
  text-decoration:none
}
.grid-bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px;
  opacity:.10;
}
header.top{
  border-bottom:1px solid var(--line);
  padding:10px 14px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px;
  background:rgba(6,7,5,.95);
  position:sticky;
  z-index:40;
  backdrop-filter:blur(8px);
}
.brand{
  font-family:var(--mono);
  font-size:11px;
  font-weight:700;
  letter-spacing:.1em;
  padding:3px 8px;
  border:1px solid var(--gold);
  color:var(--gold)
}
.title{
  font-family:var(--mono);
  font-size:13px;
  font-weight:700
}
.title .gold{
  color:var(--gold-bright)
}
.subtitle{
  font-family:var(--mono);
  font-size:9px;
  color:var(--ink-dim);
  margin-top:2px
}
.chips{
  margin-left:auto;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  font-family:var(--mono);
  font-size:9.5px
}
.chip{
  border:1px solid var(--line);
  background:var(--surface);
  padding:2px 6px
}
.chip.green{
  color:var(--green)
}
.chip.gold{
  color:var(--gold-bright)
}
.chip.cyan{
  color:var(--cyan)
}
.layout{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  margin-top:12px
}
@media(min-width:900px){
  .layout{
    grid-template-columns:280px 1fr 300px
  }
}
.panel{
  border:1px solid var(--line);
  background:var(--surface);
  padding:10px
}
.panel h3{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.12em;
  color:var(--ink-faint);
  font-weight:700;
  margin-bottom:8px;
  text-transform:uppercase
}
.stage{
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:8/5;
  background:rgba(6,7,5,.5);
  border:1px solid var(--line);
  touch-action:none;
  -webkit-user-select:none;
     -moz-user-select:none;
          user-select:none
}
.stage .geo{
  cursor:grab
}
.stage .geo:active{
  cursor:grabbing
}
.logs{
  background:#000;
  border:1px solid var(--line);
  padding:8px 10px;
  font-family:var(--mono);
  font-size:10px;
  line-height:1.6;
  color:var(--green);
  height:150px;
  overflow-y:auto;
  white-space:pre-wrap;
  word-break:break-word
}
.logs::-webkit-scrollbar{
  width:6px
}
.logs::-webkit-scrollbar-thumb{
  background:var(--line-bright);
  border-radius:3px
}
.mix{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:12px
}
.voice{
  display:flex;
  align-items:flex-start;
  gap:8px;
  padding:8px 10px;
  border:1px solid var(--line);
  background:var(--bg);
  font-family:var(--mono);
  font-size:10px
}
.voice .who{
  font-weight:700;
  min-width:64px;
  font-size:9px;
  letter-spacing:.1em;
  line-height:1.4
}
.voice .who small{
  font-size:7.5px;
  opacity:.6;
  display:block;
  font-weight:400
}
.voice .what{
  color:var(--ink-dim)
}
.burro-card{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border:1px solid var(--line);
  background:var(--surface);
  margin-top:12px
}
.burro-icon{
  width:46px;
  height:46px;
  display:grid;
  place-items:center;
  font-size:28px;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  cursor:pointer;
  -webkit-user-select:none;
     -moz-user-select:none;
          user-select:none;
  background:none;
  border:0
}
.burro-info{
  font-family:var(--mono);
  font-size:9.5px;
  color:var(--ink-dim);
  line-height:1.5
}
.burro-info .b-title{
  color:var(--gold-bright);
  font-weight:700;
  font-size:10px
}
.row{
  display:flex;
  flex-wrap:wrap;
  gap:6px
}
.btn{
  font-family:var(--mono);
  font-size:10px;
  font-weight:700;
  padding:4px 8px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--ink-dim);
  transition:all .15s
}
.btn:hover{
  border-color:var(--cyan);
  color:var(--cyan)
}
.btn.active{
  border-color:var(--gold);
  background:var(--gold);
  color:#000
}
.btn.axiom.active{
  background:var(--green);
  border-color:var(--green);
  color:#000
}
.btn:disabled{
  opacity:.45;
  cursor:wait
}
.links{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  margin-top:12px
}
@media(min-width:600px){
  .links{
    grid-template-columns:repeat(3,1fr)
  }
}
.link-card{
  display:block;
  border:1px solid;
  background:var(--surface);
  padding:10px;
  transition:background .15s
}
.link-card:hover{
  background:var(--surface-2)
}
.link-card .lc-title{
  font-family:var(--mono);
  font-weight:700;
  font-size:13px
}
.link-card .lc-role{
  font-family:var(--mono);
  font-size:9px;
  letter-spacing:.1em;
  color:var(--ink-faint);
  margin-top:3px
}
.link-card .lc-url{
  font-family:var(--mono);
  font-size:8.5px;
  color:var(--cyan);
  margin-top:4px;
  word-break:break-all
}
.kartor{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(6,7,5,.97);
  border-top:1px solid var(--line);
  padding:8px 14px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
  font-family:var(--mono);
  font-size:10px;
  z-index:50;
  backdrop-filter:blur(8px);
}
.kartor .label{
  color:var(--ink-faint);
  font-size:9px;
  letter-spacing:.1em
}
.kartor .val{
  color:var(--gold-bright);
  font-weight:700
}
.kartor .val.cyan{
  color:var(--cyan)
}
.kartor .val.green{
  color:var(--green)
}
.kartor .val.violet{
  color:var(--violet)
}
.kartor .formula{
  color:var(--ink-dim);
  font-size:9px;
  padding-left:8px;
  border-left:1px solid var(--line)
}
.seal-overlay{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  background:rgba(57,255,136,.14);
  pointer-events:none;
  z-index:100;
  opacity:0
}
.seal-overlay.active{
  animation:sealFade 2.2s forwards
}
@keyframes sealFade{
  0%{
    opacity:0
  }
  15%{
    opacity:1
  }
  100%{
    opacity:0
  }
}
.seal-text{
  font-family:var(--mono);
  font-size:22px;
  font-weight:700;
  color:var(--gold-bright);
  text-align:center;
  text-shadow:0 0 30px var(--gold-bright);
  padding:20px
}
.daseiende{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:3px;
  font-family:var(--mono);
  font-size:8.5px;
  max-height:400px;
  overflow-y:auto;
  padding-right:4px
}
.daseiende::-webkit-scrollbar{
  width:5px
}
.daseiende::-webkit-scrollbar-thumb{
  background:var(--line-bright);
  border-radius:3px
}
.ds-item{
  padding:3px 4px;
  border:1px solid var(--line);
  background:var(--bg);
  display:flex;
  flex-direction:column;
  gap:2px
}
.ds-name{
  color:var(--ink-dim);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}
.ds-score{
  height:3px;
  background:var(--line);
  position:relative
}
.ds-score>div{
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  background:var(--green)
}
.ds-item.known{
  border-color:var(--line-bright)
}
.ds-item.slot{
  opacity:.4;
  border-style:dashed
}
.ds-item.slot .ds-name{
  color:var(--ink-faint);
  font-style:italic
}
.actions{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:8px
}
@keyframes pulse{
  0%,100%{
    opacity:1
  }
  50%{
    opacity:.3
  }
}
.pulse{
  animation:pulse 1.6s ease-in-out infinite
}
@media(max-width:899px){
  .kartor{
    font-size:9px;
    gap:6px;
    padding:6px 10px
  }
  .kartor .formula{
    display:none
  }
  .daseiende{
    max-height:300px
  }
}
@media (min-width: 640px){
  .sm\:p-3{
    padding: 0.75rem;
  }
  .sm\:pb-\[110px\]{
    padding-bottom: 110px;
  }
}
